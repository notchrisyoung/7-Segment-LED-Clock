; 7-segment LED clock - ESP8266 (Wemos D1 mini / NodeMCU)
;
;   pio run -t upload        build and flash the firmware
;   pio run -t uploadfs      upload data/ (settings page + config.json) to LittleFS
;   pio device monitor       serial log (115200)

[env:d1_mini]
platform = espressif8266
board = d1_mini                    ; NodeMCU: change to nodemcuv2 (same GPIO pins)
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    fastled/FastLED@3.6.0          ; newer releases changed CRGB; 3.6.0 is tested
    bblanchon/ArduinoJson@5.13.4   ; the sketch uses the ArduinoJson v5 API
    northernwidget/DS3231@1.2.0
